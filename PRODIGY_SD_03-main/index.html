<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container py-5">

    <h1 class="text-center mb-5">
        Contact Management System
    </h1>

    <div id="notification"></div>

    <div class="row mb-4">

    <div class="col-md-4 mb-3">
        <div class="card shadow text-center p-3 stats-card">
            <i class="bi bi-people-fill display-5 text-primary"></i>
            <h5 class="mt-3">Total Contacts</h5>
            <h2 id="totalContacts">0</h2>
        </div>
    </div>

    <div class="col-md-4 mb-3">
        <div class="card shadow text-center p-3 stats-card">
            <i class="bi bi-person-check-fill display-5 text-success"></i>
            <h5 class="mt-3">Last Added</h5>
            <h6 id="lastAdded">None</h6>
        </div>
    </div>

    <div class="col-md-4 mb-3">
        <div class="card shadow text-center p-3 stats-card">
            <i class="bi bi-search display-5 text-info"></i>
            <h5 class="mt-3">Search Contacts</h5>
            <small>Use the search box below</small>
        </div>
    </div>

</div>

    <div class="card shadow p-4">

        <div class="row">

            <div class="col-md-4 mb-3">
                <input
                    type="text"
                    id="name"
                    class="form-control"
                    placeholder="Full Name">
            </div>

            <div class="col-md-4 mb-3">
                <input
                    type="text"
                    id="phone"
                    class="form-control"
                    placeholder="Phone Number">
            </div>

            <div class="col-md-4 mb-3">
                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="Email Address">
            </div>

        </div>

        <div class="text-center">

            <button
class="btn btn-primary px-5"
id="addBtn">

<i class="bi bi-person-plus-fill"></i>

Add Contact

</button>

<button
class="btn btn-success px-4 ms-2"
id="exportBtn">

<i class="bi bi-download"></i>

Export CSV

</button>

        </div>

    </div>

    <div class="card shadow mt-5 p-4">

        <input
            type="text"
            class="form-control mb-4"
            id="search"
            placeholder="Search Contact">

        <table class="table table-hover text-center">

            <thead class="table-dark">

                <tr>

                    <th>Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="contactList">

            </tbody>

        </table>

    </div>

</div>
<footer class="text-center text-white mt-5 mb-3">

    <hr>

    <p class="mb-0">

        Developed by <strong>Rohan Nautiyal</strong>

    </p>

    <small>

        Prodigy InfoTech Software Development Internship

    </small>

</footer>
<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    <i class="bi bi-exclamation-triangle-fill text-danger"></i>
                    Confirm Deletion
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                Are you sure you want to delete this contact?

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                    type="button"
                    class="btn btn-danger"
                    id="confirmDeleteBtn">

                    Delete

                </button>

            </div>

        </div>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
